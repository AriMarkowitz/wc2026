name: Fetch International Break Data

on:
  workflow_dispatch: # manual; add a `schedule:` cron covering each FIFA window

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch international-break data
        run: python scripts/fetch_intl.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intl web/data/intl.json
          git diff --staged --quiet || git commit -m "chore: update international break data [skip ci]"
          git pull --rebase origin master
          git push origin master
